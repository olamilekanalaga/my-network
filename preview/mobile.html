<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Network Intelligence · Mobile Preview</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #eaf0f9;
        color: #152748;
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          Segoe UI,
          sans-serif;
        padding: 30px 24px;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        max-width: 1270px;
        margin: 0 auto 27px;
      }
      h1 {
        font-size: 23px;
        letter-spacing: -0.7px;
        margin: 0;
      }
      p {
        font-size: 12px;
        color: #70819f;
        margin: 7px 0 0;
      }
      a {
        font-size: 12px;
        color: #365edc;
      }
      section {
        display: flex;
        justify-content: center;
        gap: 30px;
        flex-wrap: wrap;
      }
      .phone {
        width: 390px;
        height: 844px;
        border: 5px solid #172c4e;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 20px 60px #172c4e14;
        background: white;
      }
      iframe {
        border: 0;
        width: 380px;
        height: 834px;
      }
      label {
        display: block;
        font-size: 10px;
        letter-spacing: 1.4px;
        margin-bottom: 10px;
        color: #7d8eaa;
      }
      footer {
        font-size: 10px;
        text-align: center;
        color: #8998b1;
        margin-top: 23px;
      }
      @media (max-width: 450px) {
        body {
          padding: 20px 8px;
        }
        .phone {
          width: 100%;
          height: 810px;
        }
        iframe {
          width: 100%;
          height: 800px;
        }
        header {
          display: block;
          padding: 0 9px;
        }
        h1 {
          font-size: 20px;
        }
        header a {
          display: block;
          margin-top: 15px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Network Intelligence</h1>
        <p>Your private network. Greater possibilities together.</p>
      </div>
      <a href="/">Open interactive demo →</a>
    </header>
    <section>
      <div>
        <label>01 / YOUR PERSONAL INTELLIGENCE ASSISTANT</label>
        <div class="phone">
          <iframe title="Mobile home" src="/?view=Home"></iframe>
        </div>
      </div>
      <div>
        <label>02 / THE CONTEXT BEHIND EVERY CONNECTION</label>
        <div class="phone">
          <iframe title="Mobile people" src="/?view=People"></iframe>
        </div>
      </div>
      <div>
        <label>03 / FROM POSSIBILITY TO A PRACTICAL NEXT STEP</label>
        <div class="phone">
          <iframe
            title="Mobile opportunities"
            src="/?view=Opportunities"
          ></iframe>
        </div>
      </div>
    </section>
    <footer>
      Actual responsive application at 380px · Fictional demo records ·
      Browser-local storage
    </footer>
  </body>
</html>
